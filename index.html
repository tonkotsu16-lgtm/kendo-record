<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="試合記録">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>練習試合記録</title>
<style>
:root{
  --ai:#1f2a44; --ai2:#2f3e63; --paper:#f4f1ea; --card:#fffdf8; --line:#ddd6c8;
  --ink:#22252b; --sub:#6b6f78; --win:#b3261e; --lose:#3b5bab; --draw:#6b6f78;
  --warn:#9a5b00; --warnbg:#fff3dc; --ok:#2e7d4f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ai);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{margin:0;font-size:17px;letter-spacing:.08em;font-weight:700}
.status{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;flex-wrap:wrap}
.pill{border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.14)}
.pill.off{background:#c8691c}
.pill.pend{background:#e0a32a;color:#2a1d00}
.status button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.5);
  color:#fff;border-radius:999px;padding:2px 12px;font-size:12px}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ai2);margin:12px 0 6px}
label.f:first-child{margin-top:0}
label.f .req{color:var(--win);font-weight:400;margin-left:4px}
input[type=text],input[type=date],input[type=password],select{
  width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;
  font-size:15px;color:var(--ink);font-family:inherit}
.chip.on{background:var(--ai);border-color:var(--ai);color:#fff}
.chip.r-win.on{background:var(--win);border-color:var(--win)}
.chip.r-lose.on{background:var(--lose);border-color:var(--lose)}
.pts{display:grid;grid-template-columns:44px repeat(5,1fr);gap:6px;align-items:center}
.pts .who{font-size:13px;font-weight:700;text-align:center}
.pts button{padding:10px 0;border-radius:8px;font-size:17px;font-weight:700;font-family:inherit;border:1px solid}
.pts .me{background:#fdecea;border-color:#efc2bd;color:var(--win)}
.pts .op{background:#e9eef9;border-color:#c3cfeb;color:var(--lose)}
.seq{display:flex;gap:6px;align-items:center;min-height:38px;margin:8px 0 2px;flex-wrap:wrap}
.seq .p{border-radius:6px;padding:4px 10px;font-weight:700;font-size:15px}
.seq .p.me{background:var(--win);color:#fff}
.seq .p.op{background:var(--lose);color:#fff}
.seq .none{color:var(--sub);font-size:13px}
.seq .undo{margin-left:auto;background:none;border:none;color:var(--sub);text-decoration:underline;font-size:13px}
.primary{width:100%;background:var(--ai);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:17px;font-weight:700;letter-spacing:.1em;margin-top:16px;font-family:inherit}
.primary:disabled{opacity:.5}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:none;padding:10px 0 12px;font-size:13px;color:var(--sub);font-family:inherit}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--ai);font-weight:700}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters>*{flex:1}
.rec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--draw);
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rec.win{border-left-color:var(--win)} .rec.lose{border-left-color:var(--lose)}
.rec .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}
.rec .vs{font-size:16px;font-weight:700;margin:2px 0}
.rec .vs small{font-weight:400;color:var(--sub);font-size:13px}
.rec .bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec .res{font-weight:700;font-size:14px;margin-left:auto}
.rec.win .res{color:var(--win)} .rec.lose .res{color:var(--lose)}
.mini{border-radius:4px;padding:1px 7px;font-weight:700;font-size:13px;color:#fff}
.mini.me{background:var(--win)} .mini.op{background:var(--lose)}
.badge{font-size:11px;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:1px 6px}
.empty{text-align:center;color:var(--sub);padding:32px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--sub);font-weight:700}
td.n{text-align:left;font-weight:700}
.tech{font-size:12px;color:var(--sub);text-align:left}
td.n button{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--ai);text-decoration:underline;text-underline-offset:3px}
.sum{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:4px}
.sum b{display:block;font-size:22px;line-height:1.2}
.sum span{font-size:11px;color:var(--sub)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.dh h3{margin:0;font-size:15px}
.dh small{color:var(--sub);font-size:12px}
.bar{display:grid;grid-template-columns:40px 1fr 74px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar .lb{font-weight:700}
.bar .tr{background:#efe9dd;border-radius:4px;height:16px;overflow:hidden}
.bar .tr,.bar .fl{display:block}
.bar .fl{height:100%;border-radius:4px}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums}
.bar .vl small{color:var(--sub)}
.bar.top .lb,.bar.top .vl{font-weight:700}
.note{font-size:13px;margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .card{width:100%;max-width:380px;text-align:center}
.lock h2{margin:4px 0 6px;font-size:20px;color:var(--ai)}
.hidden{display:none !important}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>

<!-- パスコード画面 -->
<section id="lock" class="lock hidden">
  <div class="card">
    <h2>練習試合記録</h2>
    <p class="hint" style="margin:0 0 14px">部のパスコードを入力してください</p>
    <input type="password" id="passInput" autocomplete="off" placeholder="パスコード">
    <button class="primary" id="passBtn">はじめる</button>
    <p class="hint" id="passMsg"></p>
  </div>
</section>

<div id="appView" class="hidden">
<header>
  <h1>剣道部 練習試合記録</h1>
  <div class="status">
    <span class="pill" id="netPill">オンライン</span>
    <span class="pill pend hidden" id="pendPill"></span>
    <span id="syncText" style="opacity:.75"></span>
    <button id="syncBtn">更新</button>
  </div>
</header>

<main>
  <!-- 入力 -->
  <section id="tab-input">
    <div class="warnbox hidden" id="cfgWarn">config.js に送信先URLが設定されていません。入力はスマホ内に保存されますが、送信されません。</div>
    <div class="card">
      <label class="f">日付<span class="req">必須</span></label>
      <input type="date" id="fDate">

      <label class="f">相手校<span class="req">必須</span></label>
      <input type="text" id="fSchool" list="schoolList" placeholder="例：○○高校">
      <datalist id="schoolList"></datalist>

      <label class="f">試合形式<span class="req">必須</span></label>
      <div class="chips" id="fFormat"></div>

      <div id="posWrap" class="hidden">
        <label class="f">ポジション</label>
        <div class="chips" id="fPos"></div>
      </div>
      <p class="hint">日付・相手校・試合形式は送信後も残るので、続けて入力できます。</p>
    </div>

    <div class="card">
      <label class="f">自分の名前<span class="req">必須</span></label>
      <select id="fName"></select>

      <label class="f">相手の名前<span class="req">必須</span></label>
      <input type="text" id="fOpp" placeholder="名字のみ">
    </div>

    <div class="card">
      <label class="f">取った技・取られた技（順番に押す）</label>
      <div class="pts" id="ptsPad"></div>
      <div class="seq" id="seq"></div>

      <label class="f">結果<span class="req">必須</span></label>
      <div class="chips" id="fResult"></div>

      <label class="f">試合時間</label>
      <input type="text" id="fTime" placeholder="例：3:00／延長1:20">
    </div>

    <button class="primary" id="saveBtn">記録する</button>
  </section>

  <!-- 結果一覧 -->
  <section id="tab-list" class="hidden">
    <div class="filters">
      <select id="lName"></select>
      <input type="text" id="lSchool" placeholder="相手校で絞り込み">
    </div>
    <div id="list"></div>
  </section>

  <!-- 成績 -->
  <section id="tab-stats" class="hidden">
    <select id="sName" style="margin-bottom:10px"></select>
    <div id="detail" class="hidden"></div>
    <div id="overview">
    <div class="card" style="padding:10px">
      <table>
        <thead><tr><th style="text-align:left">名前</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
    <p class="hint">名前を押すか、上で部員を選ぶと、技ごとの割合が見られます。「反」は反則による一本です。</p>
    </div>
  </section>
</main>

<nav>
  <button data-tab="input" class="on"><b>✎</b>入力</button>
  <button data-tab="list"><b>☰</b>結果一覧</button>
  <button data-tab="stats"><b>◎</b>成績</button>
</nav>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
